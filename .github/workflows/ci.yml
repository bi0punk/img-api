name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint/test deps
        run: pip install ruff pytest Pillow
      - name: Ruff check
        run: ruff check .
      - name: Pytest
        run: pytest -q
